<body>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>先判后算 · 洛必达法则</h1></div><span id="mode-chip" class="mode-chip"></span><button id="student-mode-button" type="button" hidden>🎓 学生学习</button><select id="case-selector" aria-label="切换案例" hidden></select></header>
  <main class="wrap">
    <p id="intro" class="intro"></p>
    <section id="pretest-panel" class="panel-card" hidden></section>
    <div id="learning-shell" hidden>
      <section class="panel-card progress-card"><h2 id="case-heading"></h2><div id="progress-row" class="path-row" aria-label="检验路径"></div><div id="flowchart-trigger"></div></section>
      <div class="columns">
        <div class="left-stack"><p id="fade-notice" class="fade-notice" role="status" hidden></p><section id="node-card" class="panel-card" aria-live="polite"></section><div id="flowchart-anchor"></div></div>
        <div class="right-stack">
          <section class="panel-card"><h3>图像 · 靠近过程</h3><p id="graph-target" class="graph-caption"></p><div class="canvas-wrap"><canvas id="graph" role="img" aria-label="函数图像"></canvas></div><div id="graph-legend" class="legend"></div><p id="graph-limit" class="graph-caption graph-limit" hidden></p><p id="graph-window" class="graph-window" hidden></p></section>
          <section class="panel-card"><h3>计算面板</h3><div id="calc-panel"></div></section>
          <section id="misuse-panel" class="panel-card" hidden><h3>误用对照</h3><div id="misuse-content"></div></section>
          <section class="panel-card" id="number-panel"><h3>数值表</h3><p id="number-description" class="small">观察原函数在目标点附近的取值。</p><div id="number-table"></div></section>
          <section id="checklist-panel" class="panel-card"><details id="checklist-details"><summary><strong>四步条件清单</strong></summary><ol class="checklist"><li>是 0/0 型或 ∞/∞ 型吗？</li><li>0·∞、∞−∞ 等形式，先变形成分式了吗？</li><li>每用一次法则，新分式重新检验了吗？</li><li>导数比的极限存在吗？不存在时，法则不给结论，要换方法。</li></ol></details></section>
        </div>
      </div>
    </div>
    <section id="posttest-panel" class="panel-card" hidden></section>
    <section id="report-panel" class="panel-card" hidden></section>
    <p class="footer">离线单文件课件 · 数值只用于观察，结论以条件检验与推理为准。</p>
  </main>
  <script>
  'use strict';
  const CASE_IDS=['exp-basic','not-indet','xlnx','recheck','x-sinx'];
  const DIAGNOSIS_ORDER=['lh-type-check','lh-transform','lh-recheck','lh-reverse-inference'];
  const DIAGNOSIS_LABELS={'lh-type-check':'类型检验','lh-transform':'变形','lh-recheck':'每步再检验','lh-reverse-inference':'失效回退'};
  const HINT_PROFILE_LABELS={support:'支持',normal:'常规',challenge:'挑战'};
  const MASTERY_LABELS={independent:'独立掌握',assisted:'提示后掌握',review:'需要巩固'};
  const CASE_FOR_DIAGNOSIS={'lh-type-check':'not-indet','lh-transform':'xlnx','lh-recheck':'recheck','lh-reverse-inference':'x-sinx'};
  const NODE_DIMENSIONS={N1:'N1 · 识别类型',N2:'N2 · 验证条件',N3:'N3 · 决策',N4:'N4 · 求导后再检验',R:'R · 失效后回退'};
  const PATH_LABELS={N1:'N1 识别类型',N2:'N2 验证条件',N3:'N3 决策',N4:'N4 再检验',R:'R 失效回退'};
  const ANSWER_OPTIONS={
    N1:[['a','确定值（不是未定式）'],['b','0/0 型'],['c','∞/∞ 型'],['d','0·∞ 型']],
    N2:[['a','类型条件满足，可以尝试使用法则'],['b','类型条件不满足，不能直接使用法则']],
    N3:[['a','直接使用洛必达法则'],['b','先变形成 0/0 或 ∞/∞ 型的分式，再使用法则'],['c','不用法则，直接代入']],
    N4:[['a','仍是 0/0 或 ∞/∞ 型，再用一次法则'],['b','已不是未定式，直接代入求极限'],['c','导数比的极限不存在，法则不能给出结论']],
    R:[['a','原极限不存在'],['b','法则失效、不给结论，改用其他方法求原极限'],['c','原极限等于 2']]
  };
  const HINT_ONE={N1:'先代进去看一看：分子、分母各趋于什么？',N2:'洛必达法则只管哪两种形式？',N3:'形式不对的时候，是直接放弃，还是能先改写？',N4:'得到新的分式以后，用法则之前要先做什么？',R:'导数比的极限不存在时，法则还给出结论吗？'};
  const spec=(answer,reasons,hint2)=>({answer,reasons,hint2});
  const CASES={
    'exp-basic':{name:'基础正例：先检验，再使用',short:'x→0 时 (eˣ−1)/x',expression:'(eˣ−1)/x',limit:'x→0',path:['N1','N2','N3','N4'],points:[-.1,-.01,-.001,.001,.01,.1],range:[-.5,.5,.65,1.55],fn:x=>Math.expm1(x)/x,derivative:'(eˣ−1)′ / x′ = eˣ / 1',result:'x→0 时 eˣ/1 → 1，所以原极限为 1。',conclusion:'极限为 1。条件满足时，法则是可靠的工具。完成后可挑战 x→∞ 时 (x+sin x)/x。',flowchart:{route:['fc-N1','fc-e-N1-N2','fc-N2','fc-e-N2-N3','fc-N3','fc-e-N3-D','fc-D','fc-e-D-N4','fc-N4','fc-e-N4-E2','fc-E2'],misuse:null,trap:null},nodes:{
      N1:spec('b',['e⁰−1=0，分母 x 也趋于 0','分母趋于 0，所以极限是无穷大','是分式，所以一定是未定式'],'分别算一算 x=0 时的 e⁰−1 和分母 x。'),
      N2:spec('a',['是 0/0 型，满足类型条件','只要是分式就能用','分子分母都能求导就能用'],'0/0 型是不是法则要求的两种形式之一？'),
      N3:spec('a',['已经是 0/0 型分式，不需要变形','洛必达法则什么时候都能用','求导以后式子一定更简单'],'现在的式子已经是分式了吗？还需要改写吗？'),
      N4:spec('b',['x=0 时 e⁰/1=1，是确定值','用过一次就要一直用到底','分母是常数 1，没法再求导，只能停下'],'把 x=0 代进 eˣ/1，看看是什么形式。')
    }},
    'not-indet':{name:'类型检验：确定值不能误用',short:'x→1 时 (x²+1)/(x+1)',expression:'(x²+1)/(x+1)',limit:'x→1',path:['N1','N2','N3'],points:[.9,.99,.999,1.001,1.01,1.1],range:[.5,1.5,.65,1.45],fn:x=>(x*x+1)/(x+1),misuseFn:x=>2*x,result:'直接代入：(1²+1)/(1+1)=2/2=1。',conclusion:'极限为 1。先检验类型，才能决定是否使用法则。',correctCompare:'直接代入：2/2 = 1',wrongCompare:'误用法则：(x²+1)′/(x+1)′ = 2x/1 → 2',compareNote:'两个结果不一样，说明有一个做法错了。错在用法则之前没有检验类型。',flowchart:{route:['fc-N1','fc-e-N1-N2','fc-N2','fc-e-N2-N3','fc-N3','fc-e-N3-E1','fc-E1'],misuse:{edge:'fc-e-N3-D',label:'2x/1 → 2'},trap:{node:'N3',option:'a'}},nodes:{
      N1:spec('a',['代入 x=1，分子为 2，分母为 2','是分式，所以就是未定式','分子分母都含 x，形式不确定'],'把 x=1 代进分子 x²+1 和分母 x+1，各得多少？'),
      N2:spec('b',['2/2 不是 0/0 型，也不是 ∞/∞ 型','分子分母都可导，所以能用','用法则能算出结果，所以能用'],'2/2 是 0/0 型吗？是 ∞/∞ 型吗？'),

  function appendMathVisual(parent,source,allowFractions=true){
    let plain='',index=0;

    while(index<source.length){
      const formula=allowFractions?MATH_FRACTIONS.find(([raw])=>source.startsWith(raw,index)):null;
      if(formula){
        flush();const fraction=element('span','math-frac');
        const top=element('span','math-num'),bottom=element('span','math-den');
        appendMathVisual(top,formula[1],false);appendMathVisual(bottom,formula[2],false);
        fraction.append(top,bottom);parent.append(fraction);index+=formula[0].length;continue;
      }
      if(SUPERSCRIPTS[source[index]]){
        flush();let superscript='';
        while(index<source.length&&SUPERSCRIPTS[source[index]])superscript+=SUPERSCRIPTS[source[index++]];

      plain+=source[index++];

    flush();

  const round2=value=>Math.round(value*100)/100;

  function calculateMetrics(nodeRecords,posttest){
    const nodes=Object.values(nodeRecords),applicable=nodes.filter(node=>typeof node.reasonCorrect==='boolean');
    return {nodeIndependentRate:nodes.length?round2(nodes.filter(node=>node.hintLevelMax===0&&node.correct).length/nodes.length):0,
      nodeReasonCorrectRate:applicable.length?round2(applicable.filter(node=>node.reasonCorrect).length/applicable.length):null,
      hintLevelSum:nodes.reduce((sum,node)=>sum+node.hintLevelMax,0),posttestCorrectRate:round2(posttest.filter(item=>item.correct).length/POSTTEST_ITEMS.length)};
  }
  function buildRecommendation(data){
    const mapping={
      N1:['not-indet','这个案例正好练“识别类型”：先代入检验它是不是未定式，再决定能不能用法则。'],
      N2:['exp-basic','这个案例正好练“验证条件”：把每条条件逐一检验一遍，再决定能否使用法则。'],
      N3:['xlnx','这个案例正好练“决策与变形”：先判断它属于哪种类型，再决定是直接用法则还是先变形。'],
      N4:['recheck','这个案例正好练“每步再检验”：每用一次法则，都要重新检验一次类型。'],
      R:['x-sinx','这个案例正好练“结论有效性”：用了法则之后，先判断得到的结果能不能作为原极限的结论。']
    };
    const postNodes={'类型检验':'N1','变形':'N3','每步再检验':'N4','结论有效性':'R'};
    const order=CASES[data.caseId].path;
    const weak=[...new Set([...order.filter(id=>data.nodes[id]?.mastery==='review'),
      ...data.posttest.details.filter(item=>!item.correct).map(item=>postNodes[cleanDimension(item.dimension)]).filter(Boolean),
      ...order.filter(id=>data.nodes[id]?.mastery==='assisted')])];
    const practiced=new Set([...(data.practicedCaseIds||[]),data.caseId]);
    for(const nodeId of weak){
      const [caseId,reason]=mapping[nodeId],dimension=cleanDimension(NODE_DIMENSIONS[nodeId]);
      if(caseId!==data.caseId)return {kind:'target',caseId,caseName:CASES[caseId].name,nodeId,dimension,reason};
      const contrastId=['exp-basic','x-sinx','recheck','xlnx','not-indet']
        .find(id=>id!==data.caseId&&CASES[id].path.includes(nodeId)&&!practiced.has(id));
      if(contrastId)return {kind:'contrast',caseId:contrastId,caseName:CASES[contrastId].name,nodeId,dimension,
        reason:`这个案例同样要经过‘${dimension}’这一步，换一个情境再判断一次，和本轮的案例对照着练，比较两次判断的依据有什么不同。`};
    }
    if(weak.length){const nodeId=weak[0],dimension=cleanDimension(NODE_DIMENSIONS[nodeId]);
      return {kind:'review',caseId:null,caseName:null,nodeId,dimension,reason:`回看本轮在‘${dimension}’这一步的提示和讲解。`};}
    const caseId=['x-sinx','recheck','xlnx','not-indet','exp-basic'].find(id=>!practiced.has(id));
    return caseId?{kind:'next',caseId,caseName:CASES[caseId].name,nodeId:null,dimension:null,reason:'换一个新情境再练一次，检验你的判断能否稳定迁移。'}:null;
  }
  function buildSummaryLine(data){

      ['前测',pre.skipped?'跳过':`${pre.correct}/${pre.total}`],['前测错因',pre.skipped?'-':tags.map(clean).join(',')||'无'],

      ['用时',data.durationMs===null?'-':`${Math.round(data.durationMs/60000)}分`],
      ['陷阱误选',trapMisuse]

  }

  function buildAdviceText(data){
    const parts=[],pre=effectivePretest(data);
    if(pre?.wrongDimensions.length)parts.push(`先复习${pre.wrongDimensions.join('、')}。`);
    for(const id of CASES[data.caseId].path){const node=data.nodes[id];if(!node)continue;
      if(node.mastery==='review')parts.push(`你在${cleanDimension(node.dimension)}上仍需巩固（作答 ${node.attempts} 次，最高提示 ${node.hintLevelMax} 级）。`);

    lines.push(`训练重点：${trainingFocus(data)}`);
    const pre=effectivePretest(data);
    if(!data.pretest.skipped)lines.push(`前测：${pre.correct}/${pre.total}`,`薄弱维度：${pre.wrongDimensions.join('、')||'无'}`);
    else if(pre)lines.push(`前测：本轮未做（沿用上一轮：${pre.correct}/${pre.total}；薄弱维度：${pre.wrongDimensions.join('、')||'无'}）`);
    else lines.push('前测：已由智能体完成（课件端跳过）');
    lines.push('流程判断：');
    for(const id of CASES[data.caseId].path){const node=data.nodes[id];if(!node)continue;
      let description=`${id}（${cleanDimension(node.dimension)}）：${MASTERY_LABELS[node.mastery]||node.mastery}，作答 ${node.attempts} 次，最高提示 ${node.hintLevelMax} 级`;
      if(node.reasonText)description+=`；理由：${node.reasonText}`;
      const first=node.attemptLog[0];
      if(first&&!first.answerCorrect){const label=ANSWER_OPTIONS[id].find(([key])=>key===first.answer)?.[1];description+=`；首次判断错${label?`，选“${label}”`:''}`;}
      if(node.attemptLog.some(item=>item.answerCorrect&&!item.reasonCorrect))description+='；有一次判断对但理由错';lines.push(description);}
    lines.push(`后测：${data.posttest.correct}/${data.posttest.total}${data.posttest.formId?`（${data.posttest.formId} 组，${data.posttest.isReview?'复习题':'首次练习'}）`:''}`);
    const postStart=lines.length;
    function postLine(detail,index,compact=false){
      const clip=(value,length)=>{const text=String(value||'');return compact&&text.length>length?text.slice(0,length-1)+'…':text;};
      return `第 ${index+1} 题（${detail.dimension}${detail.variantId?`；${detail.variantId}`:''}）：${detail.correct?'正确':`错误（选 ${detail.answer}，应为 ${detail.correctAnswer}）`}`+
        (detail.question?`；题目：${clip(detail.question,48)}`:'')+
        (detail.answerText?`；选择：${detail.answer} ${clip(detail.answerText,25)}`:'')+
        (!detail.correct&&detail.correctAnswerText?`；应选：${detail.correctAnswer} ${clip(detail.correctAnswerText,25)}`:'')+
        `；依据：${clip(detail.reason,24)}`;
    }
    data.posttest.details.forEach((detail,index)=>lines.push(postLine(detail,index)));
    lines.push(`学习指标：独立判断率 ${percentage(data.metrics.nodeIndependentRate)}；理由正确率 ${percentage(data.metrics.nodeReasonCorrectRate)}；提示等级总和 ${data.metrics.hintLevelSum}；后测正确率 ${percentage(data.metrics.posttestCorrectRate)}`);
    lines.push(`主要薄弱点：${data.weaknesses.length?data.weaknesses.join('、'):'表现良好，无明显薄弱点。'}`);
    const recommendation=data.recommendation;
    if(recommendation?.kind==='review')lines.push(`推荐案例：无（建议复习：${recommendation.dimension}）`);
    else if(recommendation?.kind==='next')lines.push(`推荐案例：${recommendation.caseName}（${recommendation.caseId}）——新情境练习`);
    else if(recommendation)lines.push(`推荐案例：${recommendation.caseName}（${recommendation.caseId}）——${recommendation.kind==='contrast'?'对照练习：':''}${recommendation.reason}`);
    else lines.push('推荐案例：无（本模块案例已全部练过）');
    if(data.durationMs!==null){const seconds=Math.floor(data.durationMs/1000);lines.push(`用时：${Math.floor(seconds/60)} 分 ${seconds%60} 秒`);}
    let body=lines.join('\n');
    if(body.length>1200)body=lines.map(line=>line.replace(/；首次判断错(?:，选“[^”]*”)?/,'')).join('\n');
    if(body.length>1200)body=body.split('\n').map(line=>line.replace(/(；依据：.{75}).+/u,'$1…')).join('\n');
    if(body.length>1200){
      const compact=lines.map((line,index)=>index>=postStart&&index<postStart+data.posttest.details.length
        ?postLine(data.posttest.details[index-postStart],index-postStart,true)
        :/^(N[1-4]|R)（/.test(line)?line.replace(/；理由：.*?(?=；首次判断错|；有一次判断对但理由错|$)/, '；理由：详见节点讲解'):line);
      body=compact.join('\n');
    }
    if(body.length>1200)body=body.slice(0,1199)+'…';
    return `${body}\n\n${data.summaryLine}`;
  }
  function loadSavedSummaryLines(){
    try{const rows=JSON.parse(sessionStorage.getItem(SUMMARY_LINES_KEY)||'[]');return Array.isArray(rows)?rows.filter(row=>row&&Number.isInteger(row.round)&&row.round>0&&typeof row.sessionId==='string'&&typeof row.caseName==='string'&&CASE_IDS.includes(row.caseId)&&typeof row.summaryLine==='string'&&row.summaryLine.startsWith('【汇总行】v1|')&&!/[\r\n]/.test(row.summaryLine)):[];}catch(_error){return[];}
  }
  function saveSummaryLine(data){
    if(data.integration!=='standalone')return;
    const row={round:data.round,sessionId:data.sessionId,caseId:data.caseId,caseName:data.caseName,summaryLine:data.summaryLine};
    const index=savedSummaryLines.findIndex(item=>item.sessionId===data.sessionId&&item.round===data.round);
    if(index<0)savedSummaryLines.push(row);else savedSummaryLines[index]=row;
    try{sessionStorage.setItem(SUMMARY_LINES_KEY,JSON.stringify(savedSummaryLines));}catch(_error){}
  }
  function renderSummaryLines(data){
    const standalone=data.integration==='standalone',history=$('saved-summary-rounds');
    if(standalone&&history){history.replaceChildren();const list=element('ul','saved-rounds');
      savedSummaryLines.forEach(row=>list.append(element('li','',`第 ${row.round} 轮 · ${row.caseName} · 已保存`)));history.append(list);}
    $('copy-summary-line').textContent=standalone&&savedSummaryLines.length>1?`📋 复制全部汇总行（共 ${savedSummaryLines.length} 行）`:'📋 复制汇总行';
    $('summary-line-output').textContent=standalone?savedSummaryLines.map(row=>row.summaryLine).join('\n'):data.summaryLine;
  }
  function renderLearningSummary(){
    const checked=validateStudentId($('student-id-input').value),feedback=$('student-id-feedback');
    if(!checked.valid){feedback.textContent=checked.message;return;}
    feedback.textContent='';learningSession.studentId=checked.value;
    try{sessionStorage.setItem('xphs.studentId',checked.value);}catch(_error){}
    const data=buildLearningSummaryData();
    $('learning-summary-text').textContent=buildLearningSummaryText(data);
    if($('learning-summary-json'))$('learning-summary-json').textContent=JSON.stringify(data,null,2);
    saveSummaryLine(data);renderSummaryLines(data);
    $('learning-summary-section').hidden=false;$('summary-generate-btn').hidden=true;$('summary-update-btn').hidden=false;
    switchSummaryTab('text');learningSession.lastRenderedSummary=data;
    if(data.integration==='chaoxing-agent'&&learningSession.summaryPostedForCompletion!==learningSession.completedAt){
      if(tryPostMessageSummary(data)){learningSession.lastPostedStudentId=data.studentId;$('summary-send-status').hidden=false;$('summary-send-status').textContent='已自动发送给智能体';}
      learningSession.summaryPostedForCompletion=learningSession.completedAt;
    }
    updateSummaryResendButton();
  }
  function switchSummaryTab(tab){
    const json=$('learning-summary-json');if(tab==='json'&&!json)return;
    $('learning-summary-text').hidden=tab==='json';if(json)json.hidden=tab!=='json';
    document.querySelectorAll('.summary-tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));
  }
  async function copyLearningSummary(format){
    const source=$(format==='line'?'summary-line-output':format==='json'?'learning-summary-json':'learning-summary-text'),feedback=$('copy-feedback');
    if(!source)return;
    try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(source.textContent||'');
      feedback.className='feedback-inline success-text';feedback.textContent='已复制到剪贴板。';}
    catch(_error){if(format==='line')source.hidden=false;else{const record=$('complete-learning-record');if(record.tagName==='DETAILS')record.open=true;switchSummaryTab(format);}
      const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(source);selection?.removeAllRanges();selection?.addRange(range);
      feedback.className='feedback-inline';feedback.textContent='自动复制失败，内容已选中；请手动复制。';}
  }
  function freezeSnapshot(value){if(value&&typeof value==='object'){Object.values(value).forEach(freezeSnapshot);Object.freeze(value);}return value;}
  function startRecommendedCase(data){
    if(usageMode!=='student'||learningSession.integration==='chaoxing-agent'||!data.recommendation)return;
    const previous=learningSession,pre=effectivePretest(data),next=createLearningSession(null);
    next.sessionId=previous.sessionId;next.studentId=previous.studentId;next.entryMode='full';next.round=previous.round+1;
    next.pretestSkipped=true;next.pretestCarriedFrom=pre?freezeSnapshot(cloneData({correct:pre.correct,total:pre.total,wrongDimensions:pre.wrongDimensions,details:pre.details})):null;
    next.diagnosis=[...data.diagnosis];next.practicedCaseIds=[...new Set([...previous.practicedCaseIds,data.caseId])];
    next.hintProfile=data.hintFading.end;next.currentHintProfile=data.hintFading.end;
    next.hintFading={start:data.hintFading.end,end:data.hintFading.end,changes:[]};learningSession=next;
    $('intro').textContent='继续逐节点作答；本轮沿用上一轮的前测结果和训练重点。';startCase(data.recommendation.caseId);
    $('node-card').scrollIntoView({block:'start'});
  }
  function showRecommendationDialog(data){
    if(data.integration!=='standalone'||!data.recommendation||$('recommendation-modal'))return;
    const saved=savedSummaryLines.some(row=>row.sessionId===data.sessionId&&row.round===data.round);
    const overlay=element('div','modal-backdrop');overlay.id='recommendation-modal';
    const dialog=element('section','recommendation-dialog');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','recommendation-dialog-title');
    const title=addText(dialog,'h3','','开始下一轮练习');title.id='recommendation-dialog-title';
    addText(dialog,'p','',saved?`本轮汇总行已保存（本次共 ${savedSummaryLines.length} 行）。全部练完后，点“复制全部汇总行”一次提交即可。`:'本轮学习数据还没有保存。如需提交，请先填写姓名／学号并点“生成学习数据摘要”。');
    function close(back){overlay.remove();(back?$('student-id-input'):$('recommendation-button'))?.focus();}
    const actions=element('div','action-row');
    const returnButton=makeButton(saved?'取消':'返回生成',()=>close(!saved),'secondary');
    const nextButton=makeButton(saved?'继续跳转':'直接跳转（不保存本轮）',()=>{overlay.remove();startRecommendedCase(data);},'orange');
    if(saved)actions.append(nextButton,returnButton);else actions.append(returnButton,nextButton);dialog.append(actions);overlay.append(dialog);$('report-panel').append(overlay);
    const buttons=actions.querySelectorAll('button');buttons[0].focus();
    overlay.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();close(false);}if(event.key==='Tab'){
      const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  }

  function getSummaryParentOrigin(){
    try{if(window===window.parent)return null;const origin=document.referrer?new URL(document.referrer).origin:null;
      return ALLOWED_PARENT_ORIGINS.includes(origin)?origin:null;}catch(_error){return null;}
  }
  function tryPostMessageSummary(data){
    try{const origin=getSummaryParentOrigin();if(!origin)return false;
      window.parent.postMessage({type:'LHOPITAL_LEARNING_SUMMARY',schemaVersion:'1.1',payload:data},origin);return true;
    }catch(_error){return false;}
  }
  function updateSummaryResendButton(){
    const button=$('summary-resend-btn');if(!button)return;
    const rendered=learningSession.lastRenderedSummary;
    button.hidden=!getSummaryParentOrigin()||!rendered||!learningSession.lastPostedStudentId||
      rendered.studentId===learningSession.lastPostedStudentId;
  }
  function resendLearningSummary(){
    const data=learningSession.lastRenderedSummary;
    if(!data||!getSummaryParentOrigin()||!learningSession.lastPostedStudentId||data.studentId===learningSession.lastPostedStudentId)return;
    if(tryPostMessageSummary(data)){learningSession.lastPostedStudentId=data.studentId;$('student-id-feedback').textContent='已重新发送。';$('summary-send-status').hidden=false;$('summary-send-status').textContent='已自动发送给智能体';updateSummaryResendButton();}
  }
  function init(){
    $('mode-chip').textContent=modeLabel();
    $('intro').textContent=usageMode==='teacher'?'选择案例，逐节点演示“先判后算”的四步检验。':'每个节点先选判断，再选理由；完成案例后做 4 道后测。';
    if(usageMode==='teacher'){
      const studentButton=$('student-mode-button');studentButton.hidden=false;studentButton.addEventListener('click',startStandaloneStudy);
      const selector=$('case-selector');selector.hidden=false;
      CASE_IDS.forEach(id=>{const option=element('option','',CASES[id].name);option.value=id;selector.append(option);});
      selector.addEventListener('change',()=>startCase(selector.value));startCase('exp-basic');
    }else startCase(selectInitialCase());
  }
  init();
  </script>
</body>
</html>
